<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familia | Employee Sign-in</title><style>body{font:16px system-ui;background:#f1f5f8;min-height:100vh;display:grid;place-items:center;margin:0;color:#123453}main{background:white;padding:35px;border-radius:18px;box-shadow:0 10px 45px #20304020;max-width:390px;width:90%;box-sizing:border-box}h1{font-size:23px}label{display:block;font-weight:600;margin:24px 0 8px}input{width:100%;padding:13px;border:1px solid #cad9e0;border-radius:8px;box-sizing:border-box;font:inherit}button{margin-top:16px;background:#008e8c;border:0;border-radius:8px;padding:13px;color:white;width:100%;font:inherit;font-weight:700;cursor:pointer}.error{color:#b02b2b}</style></head><body><main><h1>Familia Quotation Studio</h1><p>Employees only · Company sign-in</p><form method="post"><label for="password">Company password</label><input id="password" name="password" type="password" required autofocus autocomplete="current-password"><button>Sign in</button></form>{% if error %}<p class="error">Incorrect password.</p>{% endif %}<p style="font-size:12px;color:#687b88">This pilot uses a shared company password, not individual employee accounts.</p></main></body></html>
